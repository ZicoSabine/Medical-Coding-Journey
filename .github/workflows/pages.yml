name: Deploy case study dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes and dashboard
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Node for calendar tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install YAML parser
        run: python -m pip install -r requirements.txt
      - name: Test case-study counting and validation
        run: python -m unittest discover -s tests -v
      - name: Test calendar and local practice workflows
        run: node --test tests/test_calendar.mjs tests/test_practice_core.mjs tests/test_practice_server.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/calendar.js
          node --check scripts/practice_core.mjs
          node --check scripts/practice_server.mjs
      - name: Build static dashboard
        run: python scripts/build_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
